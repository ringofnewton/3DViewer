<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ECM 3D Viewer — cells & collagen</title>
<style>
  :root { --ink:#e8f0ff; --muted:#9fb0c8; --panel:rgba(14,22,38,.72); --line:rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:#05080f; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; overflow:hidden; }
  #app { position:fixed; inset:0; }
  .panel { position:fixed; top:14px; left:14px; background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:14px 16px; backdrop-filter:blur(14px); width:260px; }
  .panel h1 { font-size:15px; margin:0 0 2px; letter-spacing:-.02em; }
  .panel p { margin:0 0 12px; font-size:12px; color:var(--muted); line-height:1.5; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:9px 0; font-size:13px; }
  .row label { color:var(--muted); }
  input[type=range]{ width:130px; }
  .legend { margin-top:10px; height:10px; border-radius:6px;
    background:linear-gradient(90deg,#0b0b3b,#7a1d6f,#e2643b,#ffd884); }
  .legend-l { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:4px; }
  .hint { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); font-size:12px; color:var(--muted);
    background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:7px 14px; backdrop-filter:blur(14px); }
  #err { position:fixed; inset:auto 14px 14px 14px; color:#ff9aa6; font-size:12px; white-space:pre-wrap; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div class="panel">
  <h1>ECM 3D Viewer</h1>
  <p>세포 견인으로 형성된 콜라겐 네트워크. 드래그=회전, 스크롤=확대.</p>
  <div class="row"><label>Cells</label><input id="tCells" type="checkbox" checked></div>
  <div class="row"><label>Fibers</label><input id="tFibers" type="checkbox" checked></div>
  <div class="row"><label>Cell opacity</label><input id="sOpacity" type="range" min="0" max="100" value="45"></div>
  <div class="row"><label>Ambient occlusion</label><input id="tAO" type="checkbox" checked></div>
  <div class="legend"></div>
  <div class="legend-l"><span id="legLo">low</span><span id="legHi">high</span></div>
</div>
<div class="hint">scene.json 을 불러옵니다 · 로컬에서 열면 <code>python -m http.server</code> 로 서빙하세요</div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const errEl = document.getElementById('err');
const showErr = (m) => { errEl.textContent = String(m); };

// ---- inferno-like colormap (0..1) -----------------------------------------
function colormap(t){
  t = Math.min(1, Math.max(0, t));
  const stops = [[0.0,0.02,0.02,0.23],[0.25,0.42,0.07,0.43],[0.5,0.74,0.21,0.33],
                 [0.75,0.95,0.5,0.16],[1.0,0.99,0.85,0.55]];
  for (let i=0;i<stops.length-1;i++){
    const a=stops[i], b=stops[i+1];
    if (t>=a[0] && t<=b[0]){
      const u=(t-a[0])/(b[0]-a[0]);
      return new THREE.Color(a[1]+(b[1]-a[1])*u, a[2]+(b[2]-a[2])*u, a[3]+(b[3]-a[3])*u);
    }
  }
  return new THREE.Color(0.99,0.85,0.55);
}

// ---- organic displacement noise (few octaves of incommensurate sines) -----
function bump(x,y,z){
  return 0.62*Math.sin(1.9*x+0.4)*Math.cos(2.1*y)*Math.sin(2.3*z)
       + 0.28*Math.sin(4.1*y+1.0)*Math.sin(3.7*z+0.5)
       + 0.18*Math.cos(5.3*x+2.0)*Math.sin(4.9*y+1.5);
}

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05080f);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.5, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;

const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(1,1.5,1); scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 1.1); rim.position.set(-1,0.4,-1); scene.add(rim);
scene.add(new THREE.AmbientLight(0x33405a, 0.6));

const root = new THREE.Group(); scene.add(root);
let cellGroup = new THREE.Group(), fiberMesh = null;
root.add(cellGroup);

// ---- build cells: displaced icospheres, translucent physical material -----
function makeCell(p, r, tint){
  const geo = new THREE.IcosahedronGeometry(r, 4);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos, i);
    const n = v.clone().normalize();
    const d = r * (1 + 0.12*bump(n.x*1.6+p.x*0.05, n.y*1.6+p.y*0.05, n.z*1.6+p.z*0.05));
    v.copy(n).multiplyScalar(d);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshPhysicalMaterial({
    color: tint, roughness:0.35, metalness:0.0, transmission:0.55, thickness:r*1.2,
    ior:1.38, attenuationColor: tint, attenuationDistance: r*4,
    clearcoat:0.5, clearcoatRoughness:0.4, transparent:true, opacity:0.85,
    envMapIntensity:1.1, sheen:0.4, sheenColor:new THREE.Color(0xbfe0ff)
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(p);
  return m;
}

const PHENO_TINT = { producing:0x6fb0ff, contractile:0xb98cff, degrading:0xff8d8d,
                     quiescent:0x9fe0d0 };

// ---- build fibers: one InstancedMesh of thin cylinders (per segment) -------
function buildFibers(fibers){
  let nSeg = 0;
  for (const f of fibers) nSeg += Math.max(0, f.path.length-1);
  const cyl = new THREE.CylinderGeometry(1,1,1,7,1,true);
  const mat = new THREE.MeshStandardMaterial({ roughness:0.6, metalness:0.0,
    vertexColors:false, envMapIntensity:0.7 });
  const mesh = new THREE.InstancedMesh(cyl, mat, nSeg);
  const up = new THREE.Vector3(0,1,0);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), mid = new THREE.Vector3(),
        dir = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3(),
        m4 = new THREE.Matrix4();
  let k = 0;
  for (const f of fibers){
    const col = colormap(f.v);
    for (let i=0;i<f.path.length-1;i++){
      a.fromArray(f.path[i]); b.fromArray(f.path[i+1]);
      const len = a.distanceTo(b); if (len < 1e-6) continue;
      mid.addVectors(a,b).multiplyScalar(0.5);
      dir.subVectors(b,a).normalize();
      q.setFromUnitVectors(up, dir);
      s.set(f.r, len, f.r);
      m4.compose(mid, q, s);
      mesh.setMatrixAt(k, m4);
      mesh.setColorAt(k, col);
      k++;
    }
  }
  mesh.count = k;
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  return mesh;
}

// ---- composer (SSAO) -------------------------------------------------------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const ssao = new SSAOPass(scene, camera, innerWidth, innerHeight);
ssao.kernelRadius = 9; ssao.minDistance = 0.002; ssao.maxDistance = 0.08;
composer.addPass(ssao);
composer.addPass(new OutputPass());

function frameScene(domain){
  const c = domain*0.5;
  controls.target.set(c,c,c);
  camera.position.set(c+domain*1.05, c+domain*0.7, c+domain*1.15);
  camera.near = domain*0.01; camera.far = domain*12; camera.updateProjectionMatrix();
}

async function load(){
  let data;
  try {
    const res = await fetch('scene.json', {cache:'no-store'});
    if (!res.ok) throw new Error('scene.json '+res.status);
    data = await res.json();
  } catch(e){ showErr('scene.json 로드 실패: '+e.message+'\n(로컬이면 http.server 로 서빙)'); return; }

  const domain = data.domain || 200;
  frameScene(domain);
  document.getElementById('legLo').textContent =
    ({state:'nascent', tension:'slack', reinforce:'soft'})[data.scalar] || 'low';
  document.getElementById('legHi').textContent =
    ({state:'crosslink', tension:'high tension', reinforce:'reinforced'})[data.scalar] || 'high';

  fiberMesh = buildFibers(data.fibers || []);
  root.add(fiberMesh);

  for (const c of (data.cells||[])){
    const tint = PHENO_TINT[c.pheno] ?? 0x8fb6ff;
    cellGroup.add(makeCell(new THREE.Vector3(c.p[0],c.p[1],c.p[2]), c.r, tint));
  }
  showErr('');
}
load();

// ---- UI --------------------------------------------------------------------
document.getElementById('tCells').onchange = e => cellGroup.visible = e.target.checked;
document.getElementById('tFibers').onchange = e => { if (fiberMesh) fiberMesh.visible = e.target.checked; };
document.getElementById('tAO').onchange = e => ssao.enabled = e.target.checked;
document.getElementById('sOpacity').oninput = e => {
  const o = e.target.value/100;
  cellGroup.children.forEach(m => { m.material.opacity = o; m.material.transmission = 0.2+0.6*(1-o); });
};

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  (ssao.enabled ? composer : renderer).render(scene, camera);
});
</script>
</body>
</html>
