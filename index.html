<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>3DViewer</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #08090d;
      --panel: rgba(255, 255, 255, 0.09);
      --panel-border: rgba(255, 255, 255, 0.18);
      --text: #f5f7fb;
      --muted: #a8afc2;
      --ok: #75f0b5;
      --danger: #ff6b8a;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 18% 10%, rgba(255, 0, 80, 0.18), transparent 30%),
        radial-gradient(circle at 85% 15%, rgba(0, 90, 255, 0.20), transparent 35%),
        radial-gradient(circle at 50% 90%, rgba(255, 255, 255, 0.08), transparent 28%),
        var(--bg);
    }

    .page {
      display: grid;
      grid-template-rows: auto 1fr;
      width: 100vw;
      height: 100dvh;
    }

    header {
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      padding-top: max(14px, env(safe-area-inset-top));
      background: rgba(0, 0, 0, 0.26);
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 2.4vw, 34px);
      font-weight: 800;
      letter-spacing: -0.045em;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
    }

    input[type="file"] { display: none; }

    label, button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 14px;
      border: 0;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.92);
      color: #11131a;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    button.secondary {
      color: var(--text);
      background: rgba(138, 180, 255, 0.20);
      border: 1px solid rgba(138, 180, 255, 0.36);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .file-name {
      max-width: 260px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .viewer-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
      --poster-color: transparent;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .empty-state {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 18px;
      pointer-events: none;
    }

    .empty-card {
      width: min(560px, calc(100vw - 36px));
      padding: 26px;
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      background: rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      text-align: center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
    }

    .empty-card h2 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: -0.03em;
    }

    .empty-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .status, .share-panel {
      position: absolute;
      z-index: 25;
      max-width: min(620px, calc(100vw - 36px));
      padding: 12px 14px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .status {
      right: 18px;
      bottom: max(18px, env(safe-area-inset-bottom));
    }

    .share-panel {
      left: 18px;
      bottom: max(18px, env(safe-area-inset-bottom));
      width: min(620px, calc(100vw - 36px));
    }

    .share-panel-title {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .share-panel input {
      width: 100%;
      min-height: 38px;
      padding: 0 10px;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.10);
      color: var(--text);
      font-size: 12px;
      outline: none;
    }

    .status.ok { color: var(--ok); }
    .status.error { color: var(--danger); }
    .hidden { display: none; }

    @media (max-width: 920px) {
      header {
        grid-template-columns: 1fr;
        align-items: flex-start;
      }

      .controls {
        width: 100%;
        flex-wrap: wrap;
      }

      .file-name {
        max-width: calc(100vw - 42px);
      }

      .status, .share-panel {
        left: 18px;
        right: 18px;
        width: auto;
      }

      .share-panel {
        bottom: max(78px, calc(env(safe-area-inset-bottom) + 78px));
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1>3DViewer</h1>
        <p class="subtitle">Upload a GLB file, create a shareable link, and inspect 3D models interactively.</p>
      </div>

      <div class="controls">
        <label for="modelUpload">Choose GLB</label>
        <input id="modelUpload" type="file" accept=".glb,model/gltf-binary" />
        <span id="fileName" class="file-name">No file selected</span>
        <button id="shareButton" class="secondary" disabled>Upload & Copy Link</button>
      </div>
    </header>

    <section class="viewer-wrap">
      <model-viewer
        id="viewer"
        alt="3D model viewer"
        camera-controls
        touch-action="none"
        interaction-prompt="none"
        loading="eager"
        reveal="auto"
        exposure="1.0"
        shadow-intensity="0"
        camera-orbit="45deg 65deg auto"
        min-camera-orbit="auto auto 0.05m"
        max-camera-orbit="auto auto 100m"
        field-of-view="28deg">
      </model-viewer>

      <div id="emptyState" class="empty-state">
        <div class="empty-card">
          <h2>Upload your 3D model</h2>
          <p>Select a <strong>.glb</strong> file for local preview. Local preview disappears after refresh. Click <strong>Upload & Copy Link</strong> to create a persistent shareable URL.</p>
        </div>
      </div>

      <div id="sharePanel" class="share-panel hidden">
        <div class="share-panel-title">Share URL</div>
        <input id="shareUrlInput" readonly />
      </div>

      <div id="status" class="status hidden"></div>
    </section>
  </main>

  <script>
    // Put your public Supabase project values here.
    // Use the publishable key or legacy anon key. Never use service_role or secret keys in this file.
    const SUPABASE_URL = "https://jtwfakuwkmfigcnbqqhy.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_51li1lZxtUxKB1cDCxjtZw_TEKVrFON";
    const BUCKET_NAME = "models";
    // Fixed model path for this page. Everyone can use the short page URL.
    // Uploading a new GLB replaces the model shown at /260513Progress/.
    const FIXED_MODEL_PATH = "260513Progress/model.glb";

    const input = document.getElementById("modelUpload");
    const viewer = document.getElementById("viewer");
    const fileName = document.getElementById("fileName");
    const emptyState = document.getElementById("emptyState");
    const shareButton = document.getElementById("shareButton");
    const statusBox = document.getElementById("status");
    const sharePanel = document.getElementById("sharePanel");
    const shareUrlInput = document.getElementById("shareUrlInput");

    let currentObjectUrl = null;
    let selectedFile = null;

    const supabaseReady =
      SUPABASE_URL.startsWith("http") &&
      SUPABASE_PUBLISHABLE_KEY.length > 20 &&
      !SUPABASE_URL.includes("PASTE_") &&
      !SUPABASE_PUBLISHABLE_KEY.includes("PASTE_");

    const sb = supabaseReady
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
      : null;

    function setStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = `status ${type}`.trim();
      statusBox.classList.remove("hidden");
    }

    function clearStatus() {
      statusBox.classList.add("hidden");
      statusBox.textContent = "";
    }

    function showShareUrl(url) {
      shareUrlInput.value = url;
      sharePanel.classList.remove("hidden");
    }

    function hideShareUrl() {
      sharePanel.classList.add("hidden");
      shareUrlInput.value = "";
    }

    function sanitizeFileName(name) {
      return name
        .replace(/[^a-zA-Z0-9._-]/g, "_")
        .replace(/_+/g, "_")
        .slice(0, 120);
    }

    function loadModel(src, name = "Shared GLB model") {
      setStatus("Loading model...");
      viewer.setAttribute("src", src);
      fileName.textContent = name;
      emptyState.classList.add("hidden");
    }

    function getFixedPublicModelUrl(cacheBust = false) {
      if (!supabaseReady || !sb) return null;
      const { data } = sb.storage
        .from(BUCKET_NAME)
        .getPublicUrl(FIXED_MODEL_PATH);

      if (!data || !data.publicUrl) return null;

      if (!cacheBust) return data.publicUrl;
      const url = new URL(data.publicUrl);
      url.searchParams.set("v", Date.now().toString());
      return url.toString();
    }

    async function loadFixedModelIfAvailable() {
      const modelUrl = getFixedPublicModelUrl(true);
      if (!modelUrl) return false;

      try {
        const checkUrl = getFixedPublicModelUrl(true);
        const res = await fetch(checkUrl, {
          method: "GET",
          headers: { Range: "bytes=0-0" },
          cache: "no-store"
        });

        if (!(res.ok || res.status === 206)) return false;

        showShareUrl(window.location.origin + window.location.pathname);
        loadModel(modelUrl, "260513Progress model.glb");
        return true;
      } catch (e) {
        return false;
      }
    }

    viewer.addEventListener("load", () => {
      setStatus("Model loaded successfully.", "ok");
    });

    viewer.addEventListener("error", (event) => {
      console.error("model-viewer error", event);
      const detail = event.detail && event.detail.sourceEvent
        ? event.detail.sourceEvent.message || event.detail.sourceEvent.type
        : "Unknown model loading error";
      setStatus(`Model loading failed: ${detail}`, "error");
    });

    viewer.addEventListener("progress", (event) => {
      if (!event.detail || typeof event.detail.totalProgress !== "number") return;
      const pct = Math.round(event.detail.totalProgress * 100);
      setStatus(`Loading model... ${pct}%`);
    });

    input.addEventListener("change", () => {
      clearStatus();
      hideShareUrl();

      const file = input.files && input.files[0];
      if (!file) return;

      if (!file.name.toLowerCase().endsWith(".glb")) {
        alert("Please upload a single-file .glb model.");
        input.value = "";
        return;
      }

      selectedFile = file;

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
      }

      currentObjectUrl = URL.createObjectURL(file);
      loadModel(currentObjectUrl, file.name);
      shareButton.disabled = false;
    });

    shareButton.addEventListener("click", async () => {
      if (!selectedFile) {
        setStatus("Choose a GLB file first.", "error");
        return;
      }

      if (!supabaseReady || !sb) {
        setStatus("Supabase is not configured. Paste SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY in index.html.", "error");
        return;
      }

      try {
        shareButton.disabled = true;
        setStatus("Uploading GLB to cloud storage...");

        const safeName = sanitizeFileName(selectedFile.name);
        const uniquePath = FIXED_MODEL_PATH;

        const { error: uploadError } = await sb.storage
          .from(BUCKET_NAME)
          .upload(uniquePath, selectedFile, {
            cacheControl: "0",
            upsert: true,
            contentType: "model/gltf-binary"
          });

        if (uploadError) throw uploadError;

        const { data } = sb.storage
          .from(BUCKET_NAME)
          .getPublicUrl(uniquePath);

        if (!data || !data.publicUrl) {
          throw new Error("Could not create public URL.");
        }

        // Verify that the public URL is actually readable before making a share link.
        // getPublicUrl() only constructs a URL; it does not verify that the bucket/file is public.
        try {
          const publicCheck = await fetch(data.publicUrl, {
            method: "GET",
            headers: { Range: "bytes=0-0" },
            cache: "no-store"
          });

          if (!(publicCheck.ok || publicCheck.status === 206)) {
            throw new Error(`HTTP ${publicCheck.status}`);
          }
        } catch (publicUrlError) {
          throw new Error(
            `Uploaded, but the public file URL is not readable. Make the Supabase bucket '${BUCKET_NAME}' public and check Storage policies. Details: ${publicUrlError.message || publicUrlError}`
          );
        }

        const shareUrl = new URL(window.location.origin + window.location.pathname);
        const shareUrlText = shareUrl.toString();

        // Critical: update the browser URL first. Refresh must preserve the model.
        window.history.replaceState({}, "", shareUrlText);
        showShareUrl(shareUrlText);

        try {
          await navigator.clipboard.writeText(shareUrlText);
          setStatus("Share URL created, copied, and placed in the address bar. Refresh should keep the model.", "ok");
        } catch (clipboardError) {
          console.warn("Clipboard copy failed", clipboardError);
          setStatus("Share URL created and placed in the address bar. Copy it manually from the Share URL box.", "ok");
        }
      } catch (err) {
        console.error(err);
        setStatus(`Upload failed: ${err.message || err}`, "error");
      } finally {
        shareButton.disabled = false;
      }
    });

    customElements.whenDefined("model-viewer").then(() => {
      loadFixedModelIfAvailable();
    });
  </script>
</body>
</html>
