<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>3DViewer</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #08090d;
      --panel: rgba(255, 255, 255, 0.08);
      --panel-border: rgba(255, 255, 255, 0.18);
      --text: #f5f7fb;
      --muted: #a8afc2;
      --ok: #75f0b5;
      --danger: #ff5a7a;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 0, 80, 0.18), transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(0, 70, 255, 0.20), transparent 32%),
        radial-gradient(circle at 50% 90%, rgba(255, 255, 255, 0.08), transparent 28%),
        var(--bg);
    }

    .page {
      display: grid;
      grid-template-rows: auto 1fr;
      width: 100vw;
      height: 100dvh;
    }

    header {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 14px 18px;
      padding-top: max(14px, env(safe-area-inset-top));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: rgba(0, 0, 0, 0.24);
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(22px, 2.4vw, 34px);
      font-weight: 800;
      letter-spacing: -0.045em;
    }

    .title-block p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .upload-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
    }

    .upload-label, button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 15px;
      border: 0;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.92);
      color: #11131a;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    button.secondary {
      background: rgba(138, 180, 255, 0.20);
      color: var(--text);
      border: 1px solid rgba(138, 180, 255, 0.36);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    input[type="file"] { display: none; }

    .file-name {
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 13px;
    }

    .viewer-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 100%;
      background-color: transparent;
      --poster-color: transparent;
    }

    .empty-state {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      pointer-events: none;
      padding: 18px;
    }

    .empty-card {
      width: min(560px, calc(100vw - 36px));
      padding: 26px;
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      background: rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
      text-align: center;
    }

    .empty-card h2 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: -0.03em;
    }

    .empty-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .status {
      position: absolute;
      right: 18px;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 25;
      max-width: min(520px, calc(100vw - 36px));
      padding: 12px 14px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .status.ok { color: var(--ok); }
    .status.error { color: var(--danger); }
    .hidden { display: none; }

    @media (max-width: 920px) {
      header {
        grid-template-columns: 1fr;
        align-items: flex-start;
      }

      .upload-box {
        flex-wrap: wrap;
        justify-content: flex-start;
      }

      .file-name {
        max-width: calc(100vw - 42px);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="title-block">
        <h1>3DViewer</h1>
        <p>Upload a GLB file, create a shareable link, and inspect 3D models interactively.</p>
      </div>

      <div class="upload-box">
        <label class="upload-label" for="modelUpload">Choose GLB</label>
        <input id="modelUpload" type="file" accept=".glb,model/gltf-binary" />
        <span id="fileName" class="file-name">No file selected</span>
        <button id="shareButton" class="secondary" disabled>Upload & Copy Link</button>
        <button id="testButton" class="secondary">Test Model</button>
      </div>
    </header>

    <section class="viewer-wrap">
      <model-viewer
        id="viewer"
        alt="3D model viewer"
        camera-controls
        touch-action="pan-y"
        interaction-prompt="none"
        loading="eager"
        reveal="auto"
        exposure="1.0"
        shadow-intensity="0"
        camera-orbit="45deg 65deg auto"
        min-camera-orbit="auto auto 0.05m"
        max-camera-orbit="auto auto 100m"
        field-of-view="28deg">
      </model-viewer>

      <div id="emptyState" class="empty-state">
        <div class="empty-card">
          <h2>Upload your 3D model</h2>
          <p>Select a <strong>.glb</strong> file for local preview. Local preview disappears after refresh. Click <strong>Upload & Copy Link</strong> to create a persistent shareable URL.</p>
        </div>
      </div>

      <div id="status" class="status hidden"></div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://jtwfakuwkmfigcnbqqhy.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_51li1lZxtUxKB1cDCxjtZw_TEKVrFON";
    const BUCKET_NAME = "models";
    const TEST_MODEL_URL = "https://modelviewer.dev/shared-assets/models/Astronaut.glb";

    const input = document.getElementById("modelUpload");
    const viewer = document.getElementById("viewer");
    const fileName = document.getElementById("fileName");
    const emptyState = document.getElementById("emptyState");
    const shareButton = document.getElementById("shareButton");
    const testButton = document.getElementById("testButton");
    const statusBox = document.getElementById("status");

    let currentObjectUrl = null;
    let selectedFile = null;

    const supabaseReady =
      SUPABASE_URL.startsWith("http") &&
      SUPABASE_PUBLISHABLE_KEY.length > 20 &&
      !SUPABASE_URL.includes("PASTE_") &&
      !SUPABASE_PUBLISHABLE_KEY.includes("PASTE_");

    const sb = supabaseReady
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
      : null;

    function setStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = `status ${type}`.trim();
      statusBox.classList.remove("hidden");
    }

    function hideStatus() {
      statusBox.classList.add("hidden");
    }

    function supportsWebGL() {
      try {
        const canvas = document.createElement("canvas");
        return !!(window.WebGLRenderingContext && (canvas.getContext("webgl") || canvas.getContext("experimental-webgl")));
      } catch (e) {
        return false;
      }
    }

    window.addEventListener("load", () => {
      if (!supportsWebGL()) {
        setStatus("WebGL is not available on this browser/device.", "error");
        return;
      }

      if (!customElements.get("model-viewer")) {
        setStatus("model-viewer library failed to load. Check CDN/script blocking or network settings.", "error");
      }
    });

    function sanitizeFileName(name) {
      return name
        .replace(/[^a-zA-Z0-9._-]/g, "_")
        .replace(/_+/g, "_")
        .slice(0, 120);
    }

    function loadModel(src, name = "Shared GLB model") {
      setStatus("Loading model...");
      viewer.setAttribute("src", src);
      fileName.textContent = name;
      emptyState.classList.add("hidden");
    }

    function getSharedModelFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const modelUrl = params.get("model");
      const name = params.get("name") || "Shared GLB model";
      if (modelUrl) {
        loadModel(modelUrl, name);
      }
    }

    viewer.addEventListener("load", () => {
      setStatus("Model loaded successfully.", "ok");
    });

    viewer.addEventListener("error", (event) => {
      console.error("model-viewer error", event);
      const detail = event.detail && event.detail.sourceEvent
        ? event.detail.sourceEvent.message || event.detail.sourceEvent.type
        : "Unknown model loading error";
      setStatus(`Model loading failed: ${detail}`, "error");
    });

    viewer.addEventListener("progress", (event) => {
      if (!event.detail || typeof event.detail.totalProgress !== "number") return;
      const pct = Math.round(event.detail.totalProgress * 100);
      setStatus(`Loading model... ${pct}%`);
    });

    testButton.addEventListener("click", () => {
      selectedFile = null;
      shareButton.disabled = true;
      loadModel(TEST_MODEL_URL, "Test model: Astronaut.glb");
    });

    input.addEventListener("change", () => {
      hideStatus();
      const file = input.files && input.files[0];
      if (!file) return;

      const lowerName = file.name.toLowerCase();
      const isValid = lowerName.endsWith(".glb");
      const fileSizeMB = file.size / 1024 / 1024;

      if (!isValid) {
        alert("Please upload a single-file .glb model. Use GLB instead of GLTF for sharing.");
        input.value = "";
        return;
      }

      if (fileSizeMB > 300) {
        const proceed = confirm(
          `This GLB is ${fileSizeMB.toFixed(1)} MB. Large models may freeze mobile browsers. Continue anyway?`
        );
        if (!proceed) {
          input.value = "";
          return;
        }
      }

      selectedFile = file;

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
      }

      currentObjectUrl = URL.createObjectURL(file);
      loadModel(currentObjectUrl, file.name);
      setStatus("Local preview loaded. It will disappear after refresh unless you click Upload & Copy Link.", "ok");
      shareButton.disabled = false;
    });

    shareButton.addEventListener("click", async () => {
      if (!selectedFile) return;

      if (!supabaseReady || !sb) {
        setStatus("Supabase is not configured yet. Paste SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY in the code first.", "error");
        return;
      }

      try {
        shareButton.disabled = true;
        setStatus("Uploading GLB to cloud storage...");

        const safeName = sanitizeFileName(selectedFile.name);
        const uniquePath = `models/${Date.now()}-${crypto.randomUUID()}-${safeName}`;

        const { error: uploadError } = await sb.storage
          .from(BUCKET_NAME)
          .upload(uniquePath, selectedFile, {
            cacheControl: "3600",
            upsert: false,
            contentType: "model/gltf-binary"
          });

        if (uploadError) throw uploadError;

        const { data } = sb.storage
          .from(BUCKET_NAME)
          .getPublicUrl(uniquePath);

        if (!data || !data.publicUrl) {
          throw new Error("Could not create public URL.");
        }

        const shareUrl = new URL(window.location.href);
        shareUrl.searchParams.set("model", data.publicUrl);
        shareUrl.searchParams.set("name", selectedFile.name);

        // Important: update the page URL first so refresh works even if clipboard copy fails.
        window.history.replaceState({}, "", shareUrl.toString());

        // Do NOT reload the model from Supabase immediately after upload.
        // Keep the already-working local preview active; the public URL is used on refresh/shared visits.
        let copied = false;
        try {
          await navigator.clipboard.writeText(shareUrl.toString());
          copied = true;
        } catch (clipboardError) {
          console.warn("Clipboard copy failed", clipboardError);
        }

        if (copied) {
          setStatus("Share link created and copied. Refresh will reload the cloud model from the URL.", "ok");
        } else {
          setStatus("Share link created in the address bar. Copy the current page URL manually.", "ok");
        }
      } catch (err) {
        console.error(err);
        setStatus(`Upload failed: ${err.message || err}`, "error");
      } finally {
        shareButton.disabled = false;
      }
    });

    customElements.whenDefined("model-viewer").then(() => {
      getSharedModelFromUrl();
    });
  </script>
</body>
</html>
