<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3DViewer</title>

  <!-- Google <model-viewer>: GLB/GLTF 3D model viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <!-- Supabase client for persistent cloud storage -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #08090d;
      --panel: rgba(255, 255, 255, 0.08);
      --panel-strong: rgba(255, 255, 255, 0.14);
      --panel-border: rgba(255, 255, 255, 0.18);
      --text: #f5f7fb;
      --muted: #a8afc2;
      --accent: #8ab4ff;
      --danger: #ff5a7a;
      --ok: #75f0b5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 0, 80, 0.20), transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(0, 70, 255, 0.22), transparent 32%),
        radial-gradient(circle at 50% 90%, rgba(255, 255, 255, 0.09), transparent 28%),
        var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .page {
      display: grid;
      grid-template-rows: auto 1fr;
      width: 100vw;
      height: 100vh;
    }

    header {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 18px 22px;
      backdrop-filter: blur(18px);
      background: rgba(0, 0, 0, 0.24);
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(22px, 2.4vw, 34px);
      font-weight: 800;
      letter-spacing: -0.045em;
    }

    .title-block p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .upload-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
    }

    .upload-label, button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 15px;
      border: 0;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.92);
      color: #11131a;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      user-select: none;
      transition: transform 120ms ease, background 120ms ease, opacity 120ms ease;
    }

    .upload-label:hover, button:hover {
      transform: translateY(-1px);
      background: #ffffff;
    }

    button.secondary {
      background: rgba(138, 180, 255, 0.20);
      color: var(--text);
      border: 1px solid rgba(138, 180, 255, 0.36);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none;
    }

    input[type="file"] { display: none; }

    .file-name {
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 13px;
    }

    .viewer-wrap {
      position: relative;
      width: 100%;
      height: 100%;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background-color: transparent;
      --poster-color: transparent;
    }

    .empty-state {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .empty-card {
      width: min(560px, calc(100vw - 36px));
      padding: 26px;
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      background: rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
      text-align: center;
    }

    .empty-card h2 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: -0.03em;
    }

    .empty-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .help {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 20;
      max-width: min(560px, calc(100vw - 36px));
      padding: 14px 16px;
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      background: rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .help strong { color: var(--text); }

    .status {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 25;
      max-width: min(520px, calc(100vw - 36px));
      padding: 12px 14px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .status.ok { color: var(--ok); }
    .status.error { color: var(--danger); }
    .hidden { display: none; }

    @media (max-width: 920px) {
      header {
        grid-template-columns: 1fr;
        align-items: flex-start;
      }

      .right-panel {
        width: 100%;
        align-items: stretch;
      }

      .upload-box {
        flex-wrap: wrap;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="title-block">
        <h1>3DViewer</h1>
        <p>Upload a GLB file, create a shareable link, and inspect 3D models interactively.</p>
      </div>

      <div class="right-panel">
        <div class="upload-box">
          <label class="upload-label" for="modelUpload">Choose GLB</label>
          <input id="modelUpload" type="file" accept=".glb,model/gltf-binary" />
          <span id="fileName" class="file-name">No file selected</span>
          <button id="shareButton" class="secondary" disabled>Upload & Copy Link</button>
        </div>
      </div>
    </header>

    <section class="viewer-wrap">
      <model-viewer
        id="viewer"
        alt="3D rendering viewer"
        camera-controls
        touch-action="pan-y"
        interaction-prompt="auto"
        exposure="1.15"
        shadow-intensity="0"
        environment-image="neutral"
        camera-orbit="45deg 65deg auto"
        min-camera-orbit="auto auto 0.05m"
        max-camera-orbit="auto auto 100m"
        field-of-view="28deg">
      </model-viewer>

      <div id="emptyState" class="empty-state">
        <div class="empty-card">
          <h2>Upload your 3D model</h2>
          <p>
            Select a <strong>.glb</strong> file for local preview, then click <strong>Upload & Copy Link</strong> to create a URL that other people can open.
          </p>
        </div>
      </div>
      <div id="status" class="status hidden"></div>
    </section>
  </main>

  <script>
    /*
      REQUIRED SETUP
      1. Create a Supabase project.
      2. Create a public Storage bucket named "models".
      3. Allow INSERT/SELECT for the bucket through Storage policies.
      4. Paste your Supabase project URL and publishable key below.

      Do NOT use this as a fully public production uploader without auth, rate limits,
      file-size limits, and abuse protection.
    */

    const SUPABASE_URL = "PASTE_YOUR_SUPABASE_PROJECT_URL_HERE";
    const SUPABASE_PUBLISHABLE_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";
    const BUCKET_NAME = "models";

    const input = document.getElementById("modelUpload");
    const viewer = document.getElementById("viewer");
    const fileName = document.getElementById("fileName");
    const emptyState = document.getElementById("emptyState");
    const shareButton = document.getElementById("shareButton");
    const statusBox = document.getElementById("status");

    let currentObjectUrl = null;
    let selectedFile = null;

    const supabaseReady =
      SUPABASE_URL.startsWith("http") &&
      SUPABASE_PUBLISHABLE_KEY.length > 20 &&
      !SUPABASE_URL.includes("PASTE_") &&
      !SUPABASE_PUBLISHABLE_KEY.includes("PASTE_");

    const sb = supabaseReady
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
      : null;

    function setStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = `status ${type}`.trim();
      statusBox.classList.remove("hidden");
    }

    function hideStatus() {
      statusBox.classList.add("hidden");
    }

    function sanitizeFileName(name) {
      return name
        .replace(/[^a-zA-Z0-9._-]/g, "_")
        .replace(/_+/g, "_")
        .slice(0, 120);
    }

    function loadModel(src, name = "Shared GLB model") {
      viewer.src = src;
      fileName.textContent = name;
      emptyState.classList.add("hidden");
    }

    function getSharedModelFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const modelUrl = params.get("model");
      const name = params.get("name") || "Shared GLB model";
      if (modelUrl) {
        loadModel(modelUrl, name);
        setStatus("Loaded shared model from URL.", "ok");
      }
    }

    input.addEventListener("change", () => {
      hideStatus();
      const file = input.files && input.files[0];
      if (!file) return;

      const lowerName = file.name.toLowerCase();
      const isValid = lowerName.endsWith(".glb");
      const fileSizeMB = file.size / 1024 / 1024;

      if (fileSizeMB > 300) {
        const proceed = confirm(
          `This GLB is ${fileSizeMB.toFixed(1)} MB. Large models may freeze mobile browsers. Continue anyway?`
        );
        if (!proceed) {
          input.value = "";
          return;
        }
      }

      if (!isValid) {
        alert("Please upload a single-file .glb model. Use GLB instead of GLTF for sharing.");
        input.value = "";
        return;
      }

      selectedFile = file;

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
      }

      currentObjectUrl = URL.createObjectURL(file);
      loadModel(currentObjectUrl, file.name);
      shareButton.disabled = false;
    });

    shareButton.addEventListener("click", async () => {
      if (!selectedFile) return;

      if (!supabaseReady || !sb) {
        setStatus("Supabase is not configured yet. Paste SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY in the code first.", "error");
        return;
      }

      try {
        shareButton.disabled = true;
        setStatus("Uploading GLB to cloud storage. Large files may take time and can freeze weaker mobile browsers during preview.");

        const safeName = sanitizeFileName(selectedFile.name);
        const uniquePath = `models/${Date.now()}-${crypto.randomUUID()}-${safeName}`;

        const { error: uploadError } = await sb.storage
          .from(BUCKET_NAME)
          .upload(uniquePath, selectedFile, {
            cacheControl: "3600",
            upsert: false,
            contentType: "model/gltf-binary"
          });

        if (uploadError) throw uploadError;

        const { data } = sb.storage
          .from(BUCKET_NAME)
          .getPublicUrl(uniquePath);

        if (!data || !data.publicUrl) {
          throw new Error("Could not create public URL.");
        }

        const shareUrl = new URL(window.location.href);
        shareUrl.searchParams.set("model", data.publicUrl);
        shareUrl.searchParams.set("name", selectedFile.name);

        await navigator.clipboard.writeText(shareUrl.toString());
        window.history.replaceState({}, "", shareUrl.toString());
        loadModel(data.publicUrl, selectedFile.name);

        setStatus("Share link copied to clipboard. Anyone with this link can view this GLB.", "ok");
      } catch (err) {
        console.error(err);
        setStatus(`Upload failed: ${err.message || err}`, "error");
      } finally {
        shareButton.disabled = false;
      }
    });

    getSharedModelFromUrl();
  </script>
</body>
</html>
