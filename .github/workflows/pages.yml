name: Deploy to GitHub Pages

# Publishes the repo as a static site so the viewers are reachable by URL:
#   <user>.github.io/<repo>/                         -> root index.html (GLB viewer)
#   <user>.github.io/<repo>/ecm-remodel3d/viewer/    -> ECM 3D viewer
on:
  push:
    branches:
      - claude/html-review-software-options-8ls41y
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
